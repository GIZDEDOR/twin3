name: Deploy to VPS on Content Change

on:
  repository_dispatch:
    types: [prismic-update]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 85.198.101.197 >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no root@85.198.101.197 << 'EOF'
            cd /root/twin3
            git pull origin main
            rm -rf .next
            npm install
            npm run build
            pm2 restart twin3
          EOF
